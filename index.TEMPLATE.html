    <script>
      /* SERVICE-WORKER-START*/
      // Load and register pre-caching Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
		  navigator.serviceWorker.register('service-worker.js', {
			scope: '/',
		  }).then(reg => {
			if (!reg) return;
				//Expose the registration UNCONDITIONALLY (not only when an
				//update is waiting): the auto-activation backstop must be able
				//to tell "no update pending" from "haven't looked yet", or it
				//cannot safely manage its persistent first-seen clock.
				window.CARD_WEB_SW_REGISTRATION = reg;
				const announceWaitingUpdate = () => {
				  if (!reg.waiting) return;
				  window.CARD_WEB_SW_UPDATE_REGISTRATION = reg;
				  window.dispatchEvent(new CustomEvent('card-web-service-worker-update', {detail: reg}));
				};
				//Never reload from this bootstrap script. The application owns the
				//dirty-draft/pending-write checks and explicitly activates the waiting
				//worker only when losing page state is safe.
				announceWaitingUpdate();
				reg.onupdatefound = () => {
			  const installingWorker = reg.installing;
			  if (!installingWorker) return;
	              installingWorker.onstatechange = () => {
	                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
	                  announceWaitingUpdate();
	                }
	              };
	            };
				//register() may defer its network update check for up to a day when
				//the same registration was checked recently. An explicit check keeps
				//rapid DEV deploys and ordinary warm boots from remaining indefinitely
				//on an old shell; activation is still guarded by the application UI.
				void reg.update().then(announceWaitingUpdate).catch(error =>
				  console.warn('Service worker update check failed', error));
		  }).catch(error => console.warn('Service worker registration failed', error));
        });
      }
      /* SERVICE-WORKER-END */
      // Redux assumes `process.env.NODE_ENV` exists in the ES module build.
      // https://github.com/reactjs/redux/issues/2907
      window.process = { env: { NODE_ENV: 'production' } };
    </script>
